name: CI
on:
  push:
    branches: [main, "chore/**", "feature/**", "fix/**"]
  pull_request:
    branches: [main]
jobs:
  build-and-test:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2
      - name: Restore NuGet packages
        run: nuget restore SpeedPDF.sln
      - name: Build x64 Release
        run: msbuild SpeedPDF.sln /m /p:Configuration=Release /p:Platform=x64 /verbosity:minimal
      - name: Run unit tests
        run: dotnet test tests/SpeedPDF.Tests.Unit/SpeedPDF.Tests.Unit.csproj --no-restore --configuration Release --verbosity normal
